<svg
  width="96"
  height="96"
  viewBox="0 0 96 96"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- ClipMask cắt dấu ! khi lặn xuống đáy ô tròn -->
    <clipPath id="circle-clip">
      <circle cx="48" cy="48" r="28" />
    </clipPath>
  </defs>

  <!-- ripple tỏa ra khi sang xanh -->
  <circle
    cx="48"
    cy="48"
    r="28"
    fill="none"
    stroke="#22c55e"
    stroke-width="2"
    opacity="0"
  >
    <set attributeName="opacity" to="0.35" begin="1.05s" />
    <animate attributeName="r" from="28" to="42" dur="0.65s" begin="1.05s" fill="freeze" />
    <animate attributeName="opacity" from="0.35" to="0" dur="0.65s" begin="1.05s" fill="freeze" />
  </circle>

  <!-- Vòng tròn chính cố định chính xác tâm (48, 48) -->
  <circle cx="48" cy="48" r="28" fill="#f59e0b">
    <animate
      attributeName="fill"
      values="#f59e0b;#f59e0b;#22c55e"
      keyTimes="0;0.82;1"
      dur="1.15s"
      begin="0s"
      fill="freeze"
    />
  </circle>

  <!-- Dấu ! Căn giữa chuẩn -->
  <g clip-path="url(#circle-clip)">
    <rect x="45.5" y="32" width="5" height="21" rx="2.5" fill="#fff">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 0; 0 24"
        keyTimes="0;0.35;1"
        dur="0.55s"
        begin="0.45s"
        fill="freeze"
      />
      <animate
        attributeName="opacity"
        values="1;1;0"
        keyTimes="0;0.5;1"
        dur="0.55s"
        begin="0.45s"
        fill="freeze"
      />
    </rect>

    <circle cx="48" cy="60" r="2.8" fill="#fff">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 0; 0 24"
        keyTimes="0;0.35;1"
        dur="0.55s"
        begin="0.45s"
        fill="freeze"
      />
      <animate
        attributeName="opacity"
        values="1;1;0"
        keyTimes="0;0.5;1"
        dur="0.55s"
        begin="0.45s"
        fill="freeze"
      />
    </circle>
  </g>

  <!-- Dấu tick ✓ -->
  <path
    d="M35 49 L44 58 L62 39"
    fill="none"
    stroke="#fff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0"
  >
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 8; 0 8; 0 0"
      keyTimes="0;0.3;1"
      dur="0.38s"
      begin="1.0s"
      fill="freeze"
    />
    <animate
      attributeName="opacity"
      values="0;1;1"
      keyTimes="0;0.25;1"
      dur="0.38s"
      begin="1.0s"
      fill="freeze"
    />
  </path>
</svg>
