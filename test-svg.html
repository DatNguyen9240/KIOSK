<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test SVG Animation - Căn Giữa Chuẩn 100%</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .svg-container {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 16px;
      padding: 20px;
    }
    .svg-container svg {
      width: 100%;
      height: 100%;
    }
    button {
      background-color: #0f172a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #1e293b;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Dấu ! Căn Giữa Chuẩn 100% Cả Dọc & Ngang</h2>
    
    <div class="svg-container" id="container">
      <svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="circle-clip">
            <circle cx="48" cy="48" r="28" />
          </clipPath>
        </defs>

        <!-- ripple tỏa ra -->
        <circle cx="48" cy="48" r="28" fill="none" stroke="#22c55e" stroke-width="2" opacity="0">
          <set attributeName="opacity" to="0.35" begin="1.05s" />
          <animate attributeName="r" from="28" to="42" dur="0.65s" begin="1.05s" fill="freeze" />
          <animate attributeName="opacity" from="0.35" to="0" dur="0.65s" begin="1.05s" fill="freeze" />
        </circle>

        <!-- Vòng tròn chính (48, 48) -->
        <circle cx="48" cy="48" r="28" fill="#f59e0b">
          <animate attributeName="fill" values="#f59e0b;#f59e0b;#22c55e" keyTimes="0;0.82;1" dur="1.15s" begin="0s" fill="freeze" />
        </circle>

        <!-- Dấu ! Căn giữa tuyệt đối -->
        <g clip-path="url(#circle-clip)">
          <!-- Thân dấu ! -->
          <rect x="45.5" y="32" width="5" height="21" rx="2.5" fill="#fff">
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 24" keyTimes="0;0.35;1" dur="0.55s" begin="0.45s" fill="freeze" />
            <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="0.55s" begin="0.45s" fill="freeze" />
          </rect>

          <!-- Chấm dấu ! -->
          <circle cx="48" cy="60" r="2.8" fill="#fff">
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 24" keyTimes="0;0.35;1" dur="0.55s" begin="0.45s" fill="freeze" />
            <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;1" dur="0.55s" begin="0.45s" fill="freeze" />
          </circle>
        </g>

        <!-- Dấu tick ✓ -->
        <path d="M35 49 L44 58 L62 39" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animateTransform attributeName="transform" type="translate" values="0 8; 0 8; 0 0" keyTimes="0;0.3;1" dur="0.38s" begin="1.0s" fill="freeze" />
          <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" dur="0.38s" begin="1.0s" fill="freeze" />
        </path>
      </svg>
    </div>

    <button onclick="replayAnimation()">🔄 Phát lại Hiệu ứng (Replay)</button>
  </div>

  <script>
    function replayAnimation() {
      const container = document.getElementById('container');
      const content = container.innerHTML;
      container.innerHTML = '';
      setTimeout(() => {
        container.innerHTML = content;
      }, 10);
    }
  </script>

</body>
</html>
